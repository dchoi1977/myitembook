<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyItemBook · CBT 1기</title>
<meta name="description" content="나다운 결을 발견하다 — MyItemBook 비공개 테스트">
<meta name="theme-color" content="#F4F1E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1C1B" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout: one phone-width app column (결의 아틀리에) — ivory paper, petrol ink, sage support; framed on wide screens */
:root{
  --paper:#F4F1E9; --paper-2:#E9E5DA; --card:#FBFAF5; --ink:#1F2A28; --ink-2:#465250; --ink-3:#66706E;
  --accent:#173D3B; --accent-bg:#173D3B; --on-accent:#F4F1E9; --sage:#A7B5A1; --sage-soft:#E4E9DF;
  --line:#D6DACF; --gold:#A87B2A; --gold-soft:#F3E7CC; --danger:#9A3B2E; --scrim:rgba(18,32,31,.42);
  --serif:'Noto Serif KR','Apple SD Gothic Neo','Malgun Gothic',serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1C1B; --paper-2:#0A1413; --card:#162826; --ink:#ECE8DD; --ink-2:#BCC5C0; --ink-3:#93A09B;
  --accent:#A9D2C6; --accent-bg:#A9D2C6; --on-accent:#0F1C1B; --sage:#5E7A6E; --sage-soft:#1D3331;
  --line:#2B4341; --gold:#D8B465; --gold-soft:#3A3220; --danger:#E08C7D; --scrim:rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0F1C1B; --paper-2:#0A1413; --card:#162826; --ink:#ECE8DD; --ink-2:#BCC5C0; --ink-3:#93A09B;
  --accent:#A9D2C6; --accent-bg:#A9D2C6; --on-accent:#0F1C1B; --sage:#5E7A6E; --sage-soft:#1D3331;
  --line:#2B4341; --gold:#D8B465; --gold-soft:#3A3220; --danger:#E08C7D; --scrim:rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
#root{min-height:100%}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative}
@media (min-width:640px){
  body{background:var(--paper-2)}
  .app{margin-block:24px;min-height:calc(100% - 48px);border-radius:28px;box-shadow:0 0 0 1px var(--line),0 40px 80px -40px rgba(10,30,28,.35);overflow:clip}
}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--serif);color:var(--accent);margin:0;text-wrap:balance;font-weight:700}
.h1{font-size:32px;line-height:1.28;letter-spacing:-.01em}
.h2{font-size:22px;line-height:1.35}
.h3{font-size:17px;line-height:1.4}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.lead{font-size:16px;color:var(--ink-2);line-height:1.7}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px;line-height:1.55}
.serif{font-family:var(--serif)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--serif);font-weight:700;font-size:23px;color:var(--accent);letter-spacing:.01em;line-height:1}
.logo small{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--ink-3);font-weight:700;margin-left:8px;vertical-align:middle}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--accent);display:inline-grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.demo-bar{background:var(--gold-soft);color:var(--ink);font-size:13px;padding-block:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.demo-bar button{font:inherit;font-weight:700;color:var(--accent);background:none;border:0;cursor:pointer;padding:4px 0;text-decoration:underline}

.main{flex:1;padding-block:18px 28px;display:flex;flex-direction:column;gap:20px}

/* buttons */
.btn{min-height:50px;border-radius:14px;border:1px solid var(--accent-bg);background:var(--accent-bg);color:var(--on-accent);font:inherit;font-weight:700;font-size:15px;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.3}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.quiet{background:var(--sage-soft);color:var(--accent);border-color:transparent}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px;padding:0 14px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{font:inherit;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.list-row:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* surfaces */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel.tint{background:var(--sage-soft);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.4;border-radius:999px;padding:4px 10px;background:var(--sage-soft);color:var(--accent);border:1px solid var(--sage);white-space:nowrap}
.chip.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.chip.plain{background:transparent;border-color:var(--line);color:var(--ink-2)}
.chip svg{width:13px;height:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px;white-space:nowrap}
.ai-label{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.ai-label i{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block}
.ai-label.ok i{background:var(--accent)}
.divider{height:1px;background:var(--line)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13.5px;font-weight:700;color:var(--ink)}
.field .hint{font-size:12.5px;color:var(--ink-3)}
textarea,input[type=text],input[type=month],input[type=email],input[type=url],input[type=password],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:16px;line-height:1.5}
textarea{min-height:110px;resize:vertical}
.checkline{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checkline input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent-bg);flex:none}

/* welcome */
.welcome{display:flex;flex-direction:column;gap:18px;padding-block:28px 32px}
.gem{display:block;margin-inline:auto;max-width:100%}
.gem svg{width:100%;height:100%;display:block}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.promises{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.promise{border-top:2px solid var(--accent);padding-top:8px}
.promise b{display:block;font-size:14px;color:var(--accent)}
.promise span{font-size:12.5px;color:var(--ink-2);line-height:1.5}

/* steps header */
.progress{display:flex;gap:6px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent-bg)}
.source{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.source-head{display:flex;gap:12px;align-items:center;width:100%;padding:14px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.source-ico{width:40px;height:40px;border-radius:12px;background:var(--sage-soft);display:grid;place-items:center;color:var(--accent);flex:none}
.source-ico svg{width:22px;height:22px}
.source-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.reads{font-size:12.5px;color:var(--ink-2);display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.reads b{color:var(--ink);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* reading */
.reading{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:40px}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}
.stagelist{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-3);text-align:left}
.stagelist .on{color:var(--accent);font-weight:700}
.stagelist .done{color:var(--ink-2)}

/* life card */
.lifecard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;position:relative}
.lifecard .gemname{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--accent);text-align:center}
.lifecard .sentence{font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--ink);text-align:center;text-wrap:balance}
.kw{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.minibadges{display:flex;gap:4px}
.minibadges svg{width:30px;height:30px}
.reveal-in{animation:reveal .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes reveal{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}

/* lists */
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.list-row:last-child{border-bottom:0}
.list-row .ico{width:36px;height:36px;border-radius:11px;background:var(--sage-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.list-row .ico svg{width:19px;height:19px}
.list-row .t{font-weight:700;font-size:15px}
.list-row .d{font-size:12.5px;color:var(--ink-3)}
.list-row .chev{color:var(--ink-3);font-size:18px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;justify-content:center}
.sheet-inner{width:100%;max-width:440px;height:100%;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;border-bottom:1px solid var(--line);background:var(--paper)}
.sheet-head h2{font-size:18px;flex:1}
.sheet-body{flex:1;overflow-y:auto;padding-block:18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

/* hexagon */
.hex{display:block;margin-inline:auto;max-width:100%}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top:2px dashed var(--ink-3)}

/* evidence */
.axis{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.axis:first-child{border-top:0;padding-top:0}
.axis h3{font-size:17px}
.evi{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:baseline}
.attr{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.attr:last-child{border-bottom:0}
.attr .k{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--accent);text-align:center;line-height:1.2}
.attr .k small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-3);font-weight:500}
.attr .v{font-weight:700}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.picker button[aria-pressed=true]{background:var(--accent-bg);color:var(--on-accent);border-color:var(--accent-bg)}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:1024px){.shelf.feat{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0;cursor:pointer}
.item .ph{aspect-ratio:4/3;width:100%;background:var(--sage-soft);display:grid;place-items:center;color:var(--accent);position:relative}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .ph svg{width:44px;height:44px;opacity:.75}
.item .star{position:absolute;top:8px;right:8px;background:var(--card);color:var(--gold);border-radius:999px;font-size:11.5px;font-weight:700;padding:2px 8px;border:1px solid var(--gold)}
.item .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.item .meta b{font-size:14.5px;line-height:1.35}
.item .meta span{font-size:12px;color:var(--ink-3)}
.photo-pick{aspect-ratio:4/3;border:1.5px dashed var(--sage);border-radius:16px;display:grid;place-items:center;text-align:center;color:var(--ink-2);background:var(--card);position:relative;overflow:hidden}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick{cursor:pointer}
.photo-badge{position:absolute;right:10px;bottom:10px;background:rgba(15,28,27,.72);color:#F4F1E9;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 11px}
label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.segs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer}
.segs button[aria-pressed=true]{background:var(--accent-bg);color:var(--on-accent);border-color:var(--accent-bg)}
.segs button:disabled{opacity:.45;cursor:not-allowed}

/* steps tab */
.todaystep{background:var(--accent-bg);color:var(--on-accent);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.todaystep h2{color:var(--on-accent);font-size:21px}
.todaystep .why{font-size:14px;opacity:.86;line-height:1.6}
.todaystep .btn{background:var(--on-accent);color:var(--accent-bg);border-color:var(--on-accent)}
.todaystep .btn.ghost{background:transparent;color:var(--on-accent);border-color:color-mix(in srgb,var(--on-accent) 45%,transparent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3);background:var(--card)}
.dot.done{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--on-accent)}
.dot.rest{border-color:var(--sage);background:var(--sage-soft);color:var(--accent)}
.dot.today{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--gold)}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--serif);font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--ink-3)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:4px}
.badge svg{width:60px;height:60px}
.badge b{font-size:12.5px;line-height:1.35}
.badge span{font-size:11px;color:var(--ink-3)}
.badge.locked{opacity:.55}
.group-title{display:flex;align-items:baseline;gap:8px}
.group-title b{font-family:var(--serif);color:var(--accent)}

/* people */
.person{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.person-head{display:flex;gap:12px;align-items:center}
.person-head .gem{margin:0;flex:none}
.reason{font-size:13px;color:var(--ink-2);background:var(--sage-soft);border-radius:10px;padding:8px 10px}
.example-mark{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--gold)}
.wordchips{display:flex;gap:6px;flex-wrap:wrap}

/* tab bar */
.tabbar{margin-top:auto;position:sticky;bottom:0;z-index:8;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:12px;color:var(--ink-3);background:none;border:0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current=page]{color:var(--accent);font-weight:700}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(400px,calc(100% - 32px));box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.splash{min-height:70vh;display:grid;place-items:center;text-align:center;gap:12px}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.err{font-size:13.5px;color:var(--danger)}
@media (prefers-reduced-motion: reduce){.float,.pulse,.reveal-in{animation:none}}

/* ── CBT additions ── */
.tab{position:relative}
.tabnew{position:absolute;top:3px;left:calc(50% + 8px);font-size:9.5px;padding:1px 5px;letter-spacing:.04em}
.tabdot{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--gold)}
.iconbtn.badged{position:relative}
.iconbtn .count{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
.logo small{letter-spacing:.08em}
.fab{position:fixed;right:max(16px,calc(50% - 204px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:42;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--accent);font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px -12px rgba(10,30,28,.45)}
.fab.up{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.fab svg{width:16px;height:16px}
.plainbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;width:100%;text-align:left}
.cardbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;width:100%;border-radius:18px}
.chipbtn{cursor:pointer;font:inherit;font-size:12.5px}
.react-row{display:flex;gap:8px;flex-wrap:wrap}
.react{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--accent);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.react.sm{min-height:34px;padding:0 11px;font-size:12.5px;flex:none}
.react[aria-pressed=true]{background:var(--accent-bg);color:var(--on-accent);border-color:var(--accent-bg)}
.react:disabled{opacity:.5}
.dotmark{width:8px;height:8px;border-radius:50%;background:transparent;flex:none;align-self:center}
.dotmark.on{background:var(--gold)}
.prewrap{white-space:pre-wrap;overflow-wrap:anywhere}
.ann{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;cursor:pointer;border-color:var(--gold);background:var(--gold-soft)}
.missions .list-row{padding:10px 2px}
.list-row.mission:disabled{cursor:default}
.list-row.locked .t{color:var(--ink-3)}
.mdot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-3);flex:none;background:var(--card)}
.mdot.ok{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--on-accent)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale.wide{grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.scale button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;padding:0}
.scale button[aria-pressed=true]{background:var(--accent-bg);color:var(--on-accent);border-color:var(--accent-bg)}
.dq{border-color:var(--sage)}
.consents{border-top:1px solid var(--line)}
.shareimg{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);display:block}
.weekcard{background:var(--card);border-color:var(--gold)}
.cohort{background:var(--card)}
.stat{flex-wrap:wrap}
.stat div{min-width:70px}
/* operator console */
.app.wide{max-width:1100px}
.admin .segs.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.admin .segs.scrollx button{flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpis b{display:block;font-family:var(--serif);font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.kpis span{font-size:12px;color:var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;overflow-x:auto}
.bar{flex:1;min-width:30px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--ink-3);position:relative}
.bar i{display:block;width:70%;background:var(--sage);border-radius:6px 6px 0 0;min-height:2px}
.bar b{position:absolute;top:0;font-size:11px;color:var(--ink-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.tbl th{font-size:11.5px;color:var(--ink-3);font-weight:700;background:var(--paper)}
.tbl td .faint{font-size:11.5px}
.nowrap{white-space:nowrap}
.ytmark{color:var(--accent);display:inline-grid;flex:none}
.ytmark svg{width:22px;height:22px}
/* quick start */
.quick .qc-head{padding-top:6px}
.quick .h2{font-size:24px}
.qc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qc-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.qc-grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.qc-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc-opt{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer;padding:8px 6px;line-height:1.3;transition:transform .12s ease,border-color .12s ease}
.qc-opt:active{transform:scale(.97)}
.qc-opt[aria-pressed=true]{background:var(--accent-bg);color:var(--on-accent);border-color:var(--accent-bg)}
.qc-opt.big{min-height:140px;font-family:var(--serif);font-size:18px;font-weight:700;color:var(--accent)}
.qc-opt.big[aria-pressed=true]{color:var(--on-accent)}
.qc-two.slim .qc-opt{min-height:48px}
.qc-opt.sym{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--accent);min-height:72px}
.qc-opt.sym[aria-pressed=true]{color:var(--on-accent)}
.qc-colors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qc-color{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer;padding:4px}
.qc-color span{width:58px;height:58px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s ease}
.qc-color[aria-pressed=true] span{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--accent);transform:scale(1.04)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .4s ease}
.know{border-color:var(--sage)}
/* avatars */
.avatar{display:inline-block;border-radius:50%;overflow:hidden;flex:none;background:var(--sage-soft);vertical-align:middle}
.avatar svg{width:100%;height:100%;display:block}
.whoname{display:inline-flex;align-items:center;gap:6px}
.merow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.merow .chev{color:var(--ink-3);font-size:18px}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.avpick{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:2px;font:inherit;cursor:pointer;color:var(--ink-2)}
.avpick span{display:block;width:64px;height:64px;border-radius:50%;overflow:hidden;transition:transform .12s ease}
.avpick span svg{width:100%;height:100%;display:block}
.avpick small{font-size:11.5px}
.avpick[aria-pressed=true] span{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--accent);transform:scale(1.04)}
.avpick[aria-pressed=true] small{color:var(--accent);font-weight:700}
/* evolve ceremony */
.evo{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 38%,#24524E 0%,#122B29 45%,#081312 100%);color:#F4F1E9;overflow:hidden;cursor:pointer;animation:evoIn .35s ease both}
.evo.tone-badge{background:radial-gradient(circle at 50% 38%,#4A3A1C 0%,#221B10 50%,#0D0A06 100%)}
@keyframes evoIn{from{opacity:0}to{opacity:1}}
.evo-stage{position:relative;width:280px;height:290px;display:grid;place-items:center;flex:none}
.evo-stage .gem svg{filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.evo-rays{position:absolute;inset:-90px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(216,180,101,0) 0deg 10deg,rgba(255,226,160,.18) 10deg 13deg);-webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);opacity:0;transition:opacity .8s ease}
.evo.p2 .evo-rays{opacity:1;animation:evoSpin 18s linear infinite}
@keyframes evoSpin{to{transform:rotate(360deg)}}
.evo-glow{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.95),rgba(255,226,160,.35) 45%,rgba(255,226,160,0) 70%);animation:evoGlow 1.5s ease-in forwards}
@keyframes evoGlow{0%{transform:scale(.3);opacity:.15}70%{opacity:.8}100%{transform:scale(1.7);opacity:1}}
.evo-old{position:relative;animation:evoCharge 1.5s ease-in forwards}
@keyframes evoCharge{0%{transform:scale(1)}20%{transform:scale(1.02) translateX(-2px)}30%{transform:scale(1.03) translateX(2px)}40%{transform:scale(1.04) translateX(-3px)}50%{transform:scale(1.05) translateX(3px)}60%{transform:scale(1.06) translateX(-3px)}70%{transform:scale(1.08) translateX(3px);filter:brightness(1.3)}100%{transform:scale(1.18);filter:brightness(2.2) saturate(.6)}}
.evo-in{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#FFE2A0;box-shadow:0 0 10px 3px rgba(255,226,160,.7);animation:evoConverge 1.1s ease-in infinite}
@keyframes evoConverge{0%{transform:translate(var(--x),var(--y)) scale(.6);opacity:0}25%{opacity:1}100%{transform:translate(0,0) scale(.2);opacity:0}}
.evo-flash{position:fixed;inset:0;background:#FFF8E6;opacity:0;pointer-events:none;z-index:2}
.evo.p1 .evo-flash{animation:evoFlash .55s ease-out forwards}
@keyframes evoFlash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.evo-new{position:relative;animation:evoPop .8s cubic-bezier(.18,1.5,.4,1) both}
@keyframes evoPop{0%{transform:scale(.25);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
.evo-out{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;background:#FFE2A0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:evoBurst 1.2s cubic-bezier(.1,.7,.3,1) both}
@keyframes evoBurst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.4) rotate(90deg);opacity:0}}
.evo-wait{font-size:14px;color:rgba(244,241,233,.75);letter-spacing:.04em;min-height:20px;animation:pulse 1.2s ease-in-out infinite}
.evo-text{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:380px;animation:evoUp .6s .25s ease both}
@keyframes evoUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.evo-eyebrow{font-size:11px;letter-spacing:.32em;font-weight:700;color:#D8B465}
.evo-title{font-family:var(--serif);font-size:28px;line-height:1.25;color:#FFF4D6;margin:0;text-shadow:0 2px 18px rgba(255,210,120,.35)}
.evo-sub{font-size:14px;color:rgba(244,241,233,.82);margin:0}
.evo-name{font-family:var(--serif);font-size:17px;color:#A9D2C6}
.evo-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
.evo-chip{font-size:12.5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,226,160,.35);color:#F4F1E9;white-space:nowrap}
.evo-chip b{color:#D8B465;margin-right:4px}
.evo-chip i{font-style:normal;color:#D8B465;margin:0 2px}
.evo-medals{display:flex;gap:12px;justify-content:center;margin-top:4px}
.evo-medal-mini{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:rgba(244,241,233,.8)}
.evo-actions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;margin-top:10px}
.evo-actions .btn{background:#F4F1E9;color:#173D3B;border-color:#F4F1E9}
.evo-actions .btn.ghost{background:transparent;color:#F4F1E9;border-color:rgba(244,241,233,.35)}
.evo-skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:none;border:1px solid rgba(244,241,233,.3);color:rgba(244,241,233,.8);font:inherit;font-size:12.5px;border-radius:999px;padding:6px 12px;cursor:pointer;z-index:3}
.evo.tone-mark{background:radial-gradient(circle at 50% 38%,#26365A 0%,#141D33 48%,#080B14 100%)}
.evo.tone-away{background:radial-gradient(circle at 50% 30%,#2C4A47 0%,#14211F 55%,#090F0E 100%);justify-content:center;gap:14px}
.evo-away{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:340px}
.evo-away-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,226,160,.25);animation:evoUp .5s ease both}
.evo-away-tile b{font-family:var(--serif);font-size:26px;color:#FFE2A0;line-height:1.1;font-variant-numeric:tabular-nums}
.evo-away-tile span{font-size:12.5px;color:rgba(244,241,233,.8)}
.evo-stage.sm{width:200px;height:170px}
.evo-hint{animation:evoHint 1.6s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,226,160,.35))}
@keyframes evoHint{0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 10px rgba(255,226,160,.25))}50%{transform:translateY(-4px) scale(1.03);filter:drop-shadow(0 0 26px rgba(255,226,160,.6))}}
.marks{gap:10px}
.mark-row{display:flex;flex-direction:column;gap:5px}
.mark-bar{height:6px;border-radius:99px;background:var(--line,rgba(0,0,0,.08));overflow:hidden}
.mark-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#D8B465)}
/* 업적 도감 · 보관함 */
.ach-summary{display:flex;gap:14px;align-items:center}
.ach-ring{--p:0;width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-content:center;text-align:center;background:radial-gradient(closest-side,var(--card) 78%,transparent 80%),conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0)}
.ach-ring b{font-family:var(--serif);font-size:22px;line-height:1;color:var(--accent)}.ach-ring span{font-size:11px;color:var(--ink-3)}
.ach-near{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ach-nearcard{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;color:inherit;cursor:pointer;text-align:center}
.ach-nearcard b{font-size:12.5px;line-height:1.3}.ach-nearcard .ach-bar{width:100%}
.chip[aria-pressed=true]{background:var(--accent-bg);color:var(--on-accent);border-color:var(--accent-bg)}
.chips-filter .chip,.wrap-chips .chip{cursor:pointer;font:inherit;font-size:13px}
.wrap-chips{flex-wrap:wrap;gap:6px}
.ach-list{display:flex;flex-direction:column;gap:6px}
.ach-row{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;color:inherit;cursor:pointer}
.ach-row.static{cursor:default}
.ach-row.got{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.ach-row:not(.got) .ach-medal{opacity:.85}
.ach-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.ach-name{font-size:14.5px}
.ach-rar{font-size:11px;font-weight:700;border:1px solid;border-radius:999px;padding:1px 8px;white-space:nowrap}
.ach-done{color:var(--gold);font-weight:600}
.ach-reward{color:var(--ink-3)}
.ach-prog{display:flex;align-items:center;gap:8px}.ach-prog .ach-bar{flex:1}
.ach-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.ach-bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.ach-step{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;background:var(--gold-soft);color:var(--gold)}
.ach-lvls{display:flex;gap:4px}.ach-lvls i{flex:1;height:6px;border-radius:3px;background:var(--line)}.ach-lvls i.on{background:var(--gold)}
.ach-box{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ach-slot{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;color:inherit;cursor:pointer;text-align:center}
.ach-slot b{font-size:11.5px;line-height:1.3}.ach-slot span{font-size:10.5px;color:var(--ink-3)}
.ach-slot.on{border:2px solid var(--gold);background:var(--gold-soft)}
.ach-slot.empty{opacity:.5}
.ach-frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ach-frame{display:flex;flex-direction:column;gap:2px;padding:14px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font:inherit;color:inherit;cursor:pointer;text-align:left}
.ach-frame.locked{opacity:.55;cursor:not-allowed;box-shadow:none!important;background:var(--card)!important;border:1px dashed var(--line)!important}
.ach-frame[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:2px}
.ach-detail{align-items:stretch}.ach-detail .center{text-align:center}
.ach-hero{display:grid;place-items:center;padding:10px 0;border-radius:20px;background:radial-gradient(circle,var(--gold-soft),transparent 70%)}
.ach-hero.rar-epic{background:radial-gradient(circle,rgba(181,138,216,.3),transparent 70%)}.ach-hero.rar-legend{background:radial-gradient(circle,rgba(226,188,92,.45),transparent 70%)}.ach-hero.rar-rare{background:radial-gradient(circle,rgba(126,155,209,.28),transparent 70%)}
.title-chip{font-size:12px}
.minibadges.linkbtn{padding:0;align-items:center}
/* card frames (badge rewards) */
.frame-gold{border-color:#C9A45A!important;box-shadow:0 0 0 1px #C9A45A,0 0 22px rgba(201,164,90,.35)}
.frame-rose{border-color:#C9878F!important;box-shadow:0 0 0 1px #C9878F,0 0 22px rgba(201,135,143,.35)}
.frame-star{border-color:#7E95C9!important;box-shadow:0 0 0 1px #7E95C9,0 0 22px rgba(126,149,201,.4);background-image:radial-gradient(circle at 12% 10%,rgba(126,149,201,.25) 0 1.5px,transparent 2px),radial-gradient(circle at 88% 6%,rgba(126,149,201,.3) 0 1.5px,transparent 2px),radial-gradient(circle at 94% 22%,rgba(126,149,201,.25) 0 1px,transparent 1.5px)}
.frame-ring{border-color:#8C6A3A!important;box-shadow:0 0 0 1px #8C6A3A,0 0 0 5px rgba(140,106,58,.12),0 0 0 9px rgba(140,106,58,.07),0 0 24px rgba(140,106,58,.3)}
.frame-dawn{border-color:#E7A86B!important;box-shadow:0 0 0 1px #E7A86B,0 0 22px rgba(231,168,107,.38);background-image:linear-gradient(180deg,rgba(231,168,107,.12),transparent 40%)}
.frame-seven{border:2px solid transparent!important;background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from 0deg,#E57373,#F0B65A,#E8D96A,#7CC08A,#6AA9D8,#8A7CD0,#C77BB8,#E57373) border-box!important;box-shadow:0 0 22px rgba(240,182,90,.3)}
/* badge acquisition */
.bdg{position:fixed;inset:0;z-index:72;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--gc) 70%,#000) 0%,#141414 55%,#070707 100%);color:#F4F1E9;overflow:hidden;cursor:pointer;animation:evoIn .3s ease both}
.bdg.rar-legend{background:radial-gradient(circle at 50% 38%,#5A4318 0%,#231A0B 55%,#0B0804 100%)}
.bdg.rar-epic{background:radial-gradient(circle at 50% 38%,#3E2C55 0%,#1A1326 55%,#09070D 100%)}
.bdg-stage{position:relative;width:280px;height:280px;display:grid;place-items:center;flex:none}
.bdg-flash{position:fixed;inset:0;background:#FFF8E6;opacity:0;pointer-events:none;z-index:2}
.bdg.p1 .bdg-flash{animation:evoFlash .5s ease-out forwards}
.bdg-rays{position:absolute;inset:-100px;border-radius:50%;opacity:0;background:repeating-conic-gradient(from 0deg,transparent 0deg 9deg,color-mix(in srgb,var(--rc) 40%,transparent) 9deg 12deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 66%);mask:radial-gradient(circle,#000 20%,transparent 66%);transition:opacity .6s}
.bdg.rar-legend .bdg-rays{background:repeating-conic-gradient(from 0deg,transparent 0deg 8deg,rgba(229,115,115,.35) 8deg 10deg,transparent 10deg 16deg,rgba(240,182,90,.4) 16deg 18deg,transparent 18deg 24deg,rgba(124,192,138,.35) 24deg 26deg,transparent 26deg 32deg,rgba(106,169,216,.35) 32deg 34deg,transparent 34deg 40deg,rgba(138,124,208,.35) 40deg 42deg)}
.bdg.p2 .bdg-rays{opacity:1;animation:evoSpin 16s linear infinite}
.bdg-halo{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 80%,#fff),transparent 68%);opacity:.0;animation:bdgHalo 1.2s ease-in infinite}
.bdg.p2 .bdg-halo{animation:none;opacity:.55}
.bdg.p0 .bdg-medal svg,.bdg.p1 .bdg-medal svg{filter:brightness(.18) saturate(0) drop-shadow(0 0 14px var(--rc))}

.ask-incoming{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--gold);background:var(--gold-soft);font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.ask-incoming .chev{font-size:13px;color:var(--gold);font-weight:700;white-space:nowrap}
.ask-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:none}

.ask-friend{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer;opacity:.55}
.ask-friend[aria-pressed=true]{opacity:1;border:2px solid var(--accent);color:var(--ink);font-weight:600}
.ask-block{gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ask-answers{display:flex;flex-direction:column;gap:8px}
.ask-answers.words{flex-direction:row;flex-wrap:wrap}
.ask-answer{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);font:inherit;color:inherit;text-align:left;cursor:pointer}
.ask-answers.words .ask-answer{border-color:var(--gold);background:var(--gold-soft)}
.ask-a{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--accent)}
.ask-answers.words .ask-a{font-size:20px;font-weight:700}
.ask-by{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.ask-in{gap:10px}
.ask-text{font-size:18px;color:var(--accent);line-height:1.45}
.ask-mine{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--paper-2)}
/* card showcase: a card on a deck, flip front/back */
.cardview-btn{background:linear-gradient(135deg,#173D3B,#2F5D58);color:#FFF4D6;border-color:#173D3B;letter-spacing:.02em;box-shadow:0 10px 24px -14px rgba(23,61,59,.8)}
.cardview-btn span{color:#D8B465;margin-right:4px}
.cs{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 40%,#24524E 0%,#0F2523 55%,#060E0D 100%);color:#F4F1E9;animation:evoIn .25s ease both;overflow:hidden}
.cs::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,226,160,.16),transparent 45%);pointer-events:none}
.cs-top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.cs-eyebrow{font-size:11px;letter-spacing:.3em;font-weight:700;color:#D8B465}
.cs-x{width:40px;height:40px;border-radius:50%;border:1px solid rgba(244,241,233,.3);background:rgba(255,255,255,.06);color:#F4F1E9;font-size:16px;cursor:pointer}
.cs-stage{--cw:min(84vw,420px,calc((100vh - 230px)*.8));position:relative;width:var(--cw);height:calc(var(--cw)*1.25);perspective:1600px;margin-top:22px}
.cs-deck{position:absolute;inset:0;pointer-events:none}
.cs-deck i{position:absolute;inset:0;border-radius:18px;background:linear-gradient(160deg,#2B4D49,#173D3B);border:1px solid rgba(216,180,101,.35);box-shadow:0 20px 40px -20px rgba(0,0,0,.7)}
.cs-deck i:nth-child(1){transform:translate(14px,16px) rotate(5deg);opacity:.55}
.cs-deck i:nth-child(2){transform:translate(-12px,12px) rotate(-4deg);opacity:.7}
.cs-deck i:nth-child(3){transform:translate(4px,7px) rotate(1.5deg);opacity:.85}
.cs-deck i::after{content:"";position:absolute;inset:12px;border-radius:12px;border:1px solid rgba(216,180,101,.25);background:repeating-linear-gradient(45deg,rgba(216,180,101,.05) 0 6px,transparent 6px 12px)}
.cs-card{--rx:0deg;--ry:0deg;--sx:50%;--sy:30%;position:absolute;inset:0;padding:0;border:0;background:none;cursor:pointer;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s ease-out;animation:csDeal .7s cubic-bezier(.2,1.2,.35,1) backwards}
.cs-card:focus-visible{outline:2px solid #D8B465;outline-offset:6px;border-radius:18px}
.cs-card .cs-face{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.75),0 0 0 1px rgba(216,180,101,.35);transition:transform .75s cubic-bezier(.3,1.25,.4,1);background:#F4F1E9}
.cs-card .cs-back{transform:rotateY(180deg);background:#173D3B}
.cs-card.flipped .cs-front{transform:rotateY(-180deg)}
.cs-card.flipped .cs-back{transform:rotateY(0deg)}
.cs-face img{width:100%;height:100%;object-fit:cover;display:block}
.cs-shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--sx) var(--sy),rgba(255,255,255,.32),rgba(255,255,255,0) 45%),linear-gradient(115deg,transparent 35%,rgba(255,236,190,.14) 48%,transparent 60%);mix-blend-mode:soft-light}
.cs-wait{display:grid;place-items:center;height:100%;font-size:14px;color:#66706E}
.cs-back .cs-wait{color:rgba(244,241,233,.7)}
.cs-bar{position:relative;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.cs-bar .btn{min-height:42px;background:#F4F1E9;color:#173D3B;border-color:#F4F1E9}
.cs-bar .btn.ghost{background:transparent;color:#F4F1E9;border-color:rgba(244,241,233,.4)}
.cs-seg{display:inline-flex;border:1px solid rgba(244,241,233,.35);border-radius:999px;overflow:hidden}
.cs-seg button{border:0;background:none;color:#F4F1E9;font:inherit;font-size:14px;padding:9px 16px;cursor:pointer}
.cs-seg button[aria-pressed=true]{background:#D8B465;color:#1F2A28;font-weight:700}
.cs-hint{margin:0;font-size:12px;color:rgba(244,241,233,.6);position:relative;z-index:2}
@keyframes csDeal{0%{transform:translateY(40px) rotate(-6deg) scale(.9);opacity:0}100%{transform:rotateX(var(--rx)) rotateY(var(--ry));opacity:1}}
@media (prefers-reduced-motion: reduce){.cs,.cs-card{animation:none!important}.cs-card .cs-face{transition:none!important}}
/* My GEMS inventory */
.mygems{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:linear-gradient(160deg,#173D3B,#0E2624 70%);color:#F4F1E9;box-shadow:inset 0 0 0 1px rgba(216,180,101,.35),0 18px 40px -24px rgba(10,30,28,.6)}
.mg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.mg-eyebrow{font-size:10.5px;letter-spacing:.3em;font-weight:700;color:#D8B465}
.mg-title{font-family:var(--serif);font-size:24px;margin:0;color:#FFF4D6;letter-spacing:.02em}
.mg-count{font-size:22px;font-weight:700;color:#FFE2A0;font-variant-numeric:tabular-nums}
.mg-count small{font-size:12px;font-weight:500;color:rgba(244,241,233,.7)}
.mg-tray{display:grid;gap:8px;padding:10px;border-radius:16px;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.06),transparent 60%),#0A1C1B;box-shadow:inset 0 2px 10px rgba(0,0,0,.5)}
.mg-slot{position:relative;min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:6px 4px 8px;border-radius:12px;border:1px solid rgba(216,180,101,.28);background:radial-gradient(circle at 50% 38%,rgba(169,210,198,.16),rgba(255,255,255,.02) 60%);font:inherit;color:inherit;cursor:pointer;overflow:hidden;transition:transform .15s,border-color .15s}
.mg-slot:hover,.mg-slot:focus-visible{transform:translateY(-2px);border-color:#D8B465;outline:none;box-shadow:0 0 0 2px rgba(216,180,101,.5)}
.mg-slot.empty{cursor:default;border-style:dashed;border-color:rgba(244,241,233,.12);background:rgba(255,255,255,.015)}
.mg-slot.add{justify-content:center;border-style:dashed;border-color:rgba(216,180,101,.45);background:none}
.mg-plus{font-size:28px;line-height:1;color:#D8B465}
.mg-gem{flex:1;min-height:62px;display:grid;place-items:center;width:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.mg-slot.sealed .mg-gem{filter:grayscale(.7) brightness(.75) drop-shadow(0 6px 10px rgba(0,0,0,.45));opacity:.8}
.mg-name{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#F4F1E9}
.mg-slot.sealed .mg-name{color:rgba(244,241,233,.6)}
.mg-stage{display:flex;gap:2px}.mg-stage i{width:5px;height:5px;border-radius:50%;background:rgba(244,241,233,.2)}.mg-stage i.on{background:#D8B465}
.mg-note{margin:0;font-size:12px;color:rgba(244,241,233,.7);line-height:1.6}
.mg-list summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);padding:6px 0}
.mg-list[open] summary{margin-bottom:8px}
/* gem popup */
.gp{position:fixed;inset:0;z-index:60;background:rgba(6,14,13,.78);display:grid;place-items:center;padding:20px;animation:evoIn .2s ease both;backdrop-filter:blur(3px)}

.gp-loading,.gp-sealed{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:28px 20px;border-radius:20px;background:var(--paper);color:var(--ink)}

.gp-actions{display:flex;flex-direction:column;gap:8px;width:100%}

.gp-sealed .btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
@keyframes gpPop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.gp,.gp-in,.mg-slot{animation:none!important;transition:none!important}}
